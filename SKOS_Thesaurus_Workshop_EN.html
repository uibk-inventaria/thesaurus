<title>SKOS Thesaurus Workshop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600&display=swap">
<style>
/* Layout: Werkbank mit drei Spalten – Arbeitsthesaurus (Baum) | Karteikarte des Begriffs | Bibliothek fremder Thesauri; am Telefon Reiter */
:root {
  --bg: #eef2f1; --panel: #ffffff; --ink: #17242a; --muted: #5a6b72; --line: #d5dfdd; --hover: #f2f6f5;
  --accent: #1c6a6f; --accent-ink: #ffffff; --accent-soft: #dcecea;
  --ext: #8f5f0c; --ext-soft: #f5ead3; --danger: #ad3434; --danger-soft: #f7e1e1; --ok: #2c7a4b;
  --drop: #b9dcd9; --shadow: 0 8px 28px rgba(20, 40, 45, .18);
  --f-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-head: "IBM Plex Sans Condensed", "IBM Plex Sans", "Arial Narrow", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e1416; --panel: #152024; --ink: #e1eaea; --muted: #93a5aa; --line: #26363b; --hover: #1b2a2f;
  --accent: #5db0b3; --accent-ink: #0e1416; --accent-soft: #173a3c;
  --ext: #dcaa52; --ext-soft: #3a2d15; --danger: #e07a7a; --danger-soft: #3d1f1f; --ok: #6cc28f;
  --drop: #245457; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0e1416; --panel: #152024; --ink: #e1eaea; --muted: #93a5aa; --line: #26363b; --hover: #1b2a2f;
  --accent: #5db0b3; --accent-ink: #0e1416; --accent-soft: #173a3c;
  --ext: #dcaa52; --ext-soft: #3a2d15; --danger: #e07a7a; --danger-soft: #3d1f1f; --ok: #6cc28f;
  --drop: #245457; --shadow: 0 8px 28px rgba(0, 0, 0, .5); color-scheme: dark }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--f-ui); display: flex; flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-size: 12px; }
.muted { color: var(--muted); }

header.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; padding-block: 10px 8px; }
header.top h1 { font: 600 19px/1.1 var(--f-head); letter-spacing: .01em; margin: 0; display: flex; align-items: baseline; gap: 8px; }
header.top h1 { flex-wrap: wrap; min-width: 0; }
header.top h1 small { font: 400 12px var(--f-mono); color: var(--muted); word-break: break-all; }
.toolbar { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 10px; line-height: 1.2; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.armed { background: var(--danger); color: #fff; border-color: var(--danger); }
.btn.small { padding: 2px 7px; font-size: 12px; }
.langsel { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); }
.langsel select { border: 1px solid var(--line); border-radius: 5px; padding: 1px 4px; background: var(--bg); font-size: 12px; max-width: 120px; }
.row .fl { font: 10px var(--f-mono); color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 3px; flex: none; }
.btn:disabled { opacity: .45; cursor: default; }
.menu { position: relative; }
.menu > .pop { position: absolute; right: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; z-index: 30; min-width: 250px; display: grid; gap: 2px; }
.menu > .pop button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; }
.menu > .pop button:hover { background: var(--hover); }
.menu > .pop .sep { height: 1px; background: var(--line); margin: 4px 2px; }
.status { font-size: 12px; color: var(--muted); padding-block: 0 8px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.status b { color: var(--ink); font-weight: 500; }

.tabs { display: none; gap: 4px; padding-block: 0 8px; }
.tabs button { flex: 1; border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 6px; }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.25fr) minmax(0, .95fr); gap: 12px; padding-block: 0 12px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-height: 0; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }
.panel > .ph { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.panel > .ph h2 { font: 600 13px var(--f-head); text-transform: uppercase; letter-spacing: .06em; margin: 0; color: var(--muted); }
.panel > .ph .grow { flex: 1; }
.panel > .pb { flex: 1; overflow: auto; min-height: 0; }
.search { padding: 8px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; }
.search input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; background: var(--bg); }
.hint { font-size: 12px; color: var(--muted); padding: 6px 12px; border-bottom: 1px solid var(--line); }
.hint kbd { font: 500 11px var(--f-mono); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--bg); }

.tree { padding: 6px 4px 30px; }
.row { display: flex; align-items: center; gap: 4px; padding: 2px 6px 2px 0; border-radius: 5px; cursor: pointer; user-select: none; min-height: 25px; }
.row:hover { background: var(--hover); }
.row.sel { background: var(--accent-soft); }
.row.drop { background: var(--drop); outline: 1px dashed var(--accent); }
.row .tg { width: 18px; flex: none; text-align: center; color: var(--muted); font-size: 11px; }
.row .lb { flex: 0 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .id { font: 11px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; min-width: 0; }
.row .n { font: 11px var(--f-mono); color: var(--muted); margin-left: auto; padding-left: 6px; flex: none; }
.row.ref .lb { font-style: italic; color: var(--muted); }
.row.grp .lb { font-weight: 600; }
.badge { font: 500 10px var(--f-mono); padding: 0 5px; border-radius: 3px; background: var(--ext-soft); color: var(--ext); flex: none; text-transform: uppercase; letter-spacing: .03em; }
.badge.new { background: var(--accent-soft); color: var(--accent); }
.topdrop { margin: 6px 8px; padding: 6px; border: 1px dashed var(--line); border-radius: 6px; text-align: center; font-size: 12px; color: var(--muted); }
.topdrop.drop { background: var(--drop); border-color: var(--accent); color: var(--ink); }
.results .row { padding-left: 8px; }
.results .path { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.card { padding: 14px 16px 40px; display: grid; gap: 16px; }
.card .head { display: grid; gap: 4px; }
.card .head .title { font: 600 22px/1.2 var(--f-head); text-wrap: balance; margin: 0; }
.card .head .uri { font: 12px var(--f-mono); color: var(--muted); word-break: break-all; }
.card .head .uri a { color: inherit; }
.warn { background: var(--ext-soft); color: var(--ext); border-radius: 6px; padding: 6px 10px; font-size: 12px; }
.sec { display: grid; gap: 6px; }
.sec > h3 { font: 600 12px var(--f-head); text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin: 0; display: flex; align-items: center; gap: 8px; }
.sec > h3 .btn { text-transform: none; letter-spacing: 0; font-family: var(--f-ui); font-weight: 400; }
.lrow { display: grid; grid-template-columns: 92px minmax(0, 1fr) 28px; gap: 6px; align-items: start; }
.lrow input, .lrow textarea, .field input, .field select { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--bg); min-width: 0; }
.lrow textarea { resize: vertical; min-height: 54px; }
.lrow .x { border: 0; background: none; color: var(--muted); padding: 5px 0; }
.lrow .x:hover { color: var(--danger); }
.field { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 6px; align-items: center; }
.field label { font-size: 12px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.extlink { color: var(--accent); text-decoration: none; word-break: break-all; }
.extlink:hover { text-decoration: underline; }
.jump { color: var(--ink); cursor: pointer; }
.jump:hover { text-decoration: underline; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 14px; padding: 2px 4px 2px 10px; background: var(--bg); max-width: 100%; }
.chip > span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; }
.chip > span:hover { text-decoration: underline; }
.chip .x { border: 0; background: none; color: var(--muted); padding: 0 4px; }
.chip .x:hover { color: var(--danger); }
.chip.ext { border-color: var(--ext); }
.picker { position: relative; }
.picker input { width: 100%; border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--bg); }
.picker .list { position: absolute; left: 0; right: 0; top: calc(100% + 2px); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); max-height: 260px; overflow: auto; z-index: 20; }
.picker .list button { display: flex; width: 100%; gap: 8px; border: 0; background: none; text-align: left; padding: 5px 8px; }
.picker .list button:hover, .picker .list button.on { background: var(--hover); }
.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 2px 10px; font-size: 12px; }
.kv dt { color: var(--muted); font-family: var(--f-mono); }
.kv dd { margin: 0; word-break: break-word; }
.empty { padding: 40px 20px; color: var(--muted); text-align: center; display: grid; gap: 10px; justify-items: center; }
.empty strong { color: var(--ink); font: 600 16px var(--f-head); }
.actions { display: flex; flex-wrap: wrap; gap: 6px; }

.lib .src { border-bottom: 1px solid var(--line); }
.lib .srch { display: flex; align-items: center; gap: 6px; padding: 7px 10px; cursor: pointer; }
.lib .srch:hover { background: var(--hover); }
.lib .srch .nm { font-weight: 500; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lib .tree { padding-top: 0; }

dialog { border: 1px solid var(--line); border-radius: 12px; padding: 0; background: var(--panel); color: var(--ink); box-shadow: var(--shadow); width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 40px); }
dialog::backdrop { background: rgba(10, 20, 24, .45); }
dialog .dh { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); gap: 10px; }
dialog .dh h2 { font: 600 17px var(--f-head); margin: 0; flex: 1; }
dialog .db { padding: 14px 16px; display: grid; gap: 12px; overflow: auto; max-height: calc(100vh - 170px); }
dialog .df { display: flex; justify-content: flex-end; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
dialog p { margin: 0; }
.tbl { overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 12px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 4px 6px; text-align: left; vertical-align: top; }
.tbl th { background: var(--hover); font-weight: 500; position: sticky; top: 0; }
.tbl input, .tbl select { width: 100%; min-width: 70px; border: 1px solid var(--line); border-radius: 4px; padding: 3px 5px; background: var(--bg); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.grid2 label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.grid2 input, .grid2 select, dialog textarea { border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; background: var(--bg); width: 100%; }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; }
.progress { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.progress > div { height: 100%; width: 0; background: var(--accent); transition: width .2s; }
.log { font: 12px var(--f-mono); background: var(--bg); border-radius: 6px; padding: 8px; max-height: 180px; overflow: auto; white-space: pre-wrap; }
.issue { display: flex; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.issue .k { font: 11px var(--f-mono); padding: 1px 6px; border-radius: 3px; background: var(--danger-soft); color: var(--danger); flex: none; align-self: start; }
.issue .k.w { background: var(--ext-soft); color: var(--ext); }
.issue a { cursor: pointer; color: var(--accent); }
.dropmenu { position: fixed; z-index: 50; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 6px; display: grid; gap: 2px; min-width: 230px; }
.dropmenu button { text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 5px; }
.dropmenu button:hover { background: var(--hover); }
.dropmenu .t { font-size: 12px; color: var(--muted); padding: 4px 10px; }
#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--panel); padding: 8px 14px; border-radius: 8px; font-size: 13px; z-index: 60; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.filedrop { position: fixed; inset: 0; background: rgba(28, 106, 111, .18); border: 3px dashed var(--accent); z-index: 70; display: grid; place-items: center; font: 600 20px var(--f-head); color: var(--ink); pointer-events: none; }

@media (max-width: 900px) {
  .tabs { display: flex; }
  main { grid-template-columns: minmax(0, 1fr); }
  main > .panel { display: none; }
  main > .panel.on { display: flex; }
  .toolbar { margin-left: 0; }
  .lrow { grid-template-columns: 76px minmax(0, 1fr) 24px; }
  .field { grid-template-columns: 76px minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <h1>SKOS Thesaurus Workshop <small id="projName"></small></h1>
  <div class="toolbar">
    <button class="btn" id="bUndo" title="Undo last change" disabled>↶ Undo</button>
    <div class="menu"><button class="btn" data-menu="mLoad">Load ▾</button>
      <div class="pop" id="mLoad" hidden>
        <button data-act="openWorking">Open SKOS thesaurus as working thesaurus (.ttl, .rdf, .nt, .nq, .trig)…</button>
        <button data-act="openLibrary">Load SKOS thesaurus into the library (BBT, AAT …)…</button>
        <div class="sep"></div>
        <button data-act="openExcel">Import concepts from Excel…</button>
        <button data-act="openMindmap">Import hierarchy from mind map (.mmap, .mm, .opml)…</button>
        <button data-act="openAat">Take over AAT concepts from the Getty dump…</button>
        <div class="sep"></div>
        <button data-act="openProject">Open project file (.json)…</button>
        <button data-act="newProject">New, empty project…</button>
      </div></div>
    <div class="menu"><button class="btn" data-menu="mSave">Save ▾</button>
      <div class="pop" id="mSave" hidden>
        <button data-act="exportTtl">SKOS as Turtle (.ttl)</button>
        <button data-act="exportNq">N-Quads with graphs (.nq): working thesaurus + library concepts used</button>
        <button data-act="copyTtl">Copy SKOS Turtle to clipboard</button>
        <button data-act="exportXlsx">Concept list as Excel (.xlsx)</button>
        <button data-act="exportMindmap">Mind map for MindManager (.mmap)</button>
        <button data-act="exportMm">Mind map in FreeMind format (.mm)</button>
        <div class="sep"></div>
        <button data-act="saveProject">Project file (.json) – complete working state</button>
      </div></div>
    <button class="btn" data-act="prefixes">Prefixes &amp; IDs</button>
    <button class="btn" data-act="validate">Validate</button>
  </div>
</header>
<div class="status" id="status"></div>
<div class="tabs" role="tablist">
  <button role="tab" data-tab="pTree" aria-selected="true">Tree</button>
  <button role="tab" data-tab="pCard" aria-selected="false">Concept</button>
  <button role="tab" data-tab="pLib" aria-selected="false">Library</button>
</div>
<main>
  <section class="panel on" id="pTree">
    <div class="ph"><h2>Working thesaurus</h2><span class="grow"></span>
      <label class="langsel" title="Language of the labels in the tree and the library. If a concept has no label in this language, an available language is shown (marked with its language tag).">Language <select id="treeLang"></select></label>
      <button class="btn small" data-act="collapseAll" title="Collapse all">Collapse</button>
      <button class="btn small primary" data-act="newTop">+ Concept</button></div>
    <div class="search"><input id="q" type="search" placeholder="Search: label, spelling, ID …" autocomplete="off"></div>
    <div class="hint">Drag = <b>move</b> · with <kbd>Ctrl</kbd>/<kbd>⌥</kbd> = <b>add as additional parent</b> (polyhierarchy) · drag from the library = take over</div>
    <div class="pb" id="treeBox"></div>
  </section>
  <section class="panel" id="pCard">
    <div class="ph"><h2>Concept</h2><span class="grow"></span><span id="cardBadges"></span></div>
    <div class="pb" id="cardBox"></div>
  </section>
  <section class="panel" id="pLib">
    <div class="ph"><h2>Library</h2><span class="grow"></span>
      <button class="btn small" data-act="openLibrary">+ Thesaurus</button></div>
    <div class="search"><input id="qLib" type="search" placeholder="Search the library …" autocomplete="off"></div>
    <div class="pb lib" id="libBox"></div>
  </section>
</main>

<input type="file" id="fileIn" hidden>
<dialog id="dlg"><div class="dh"><h2 id="dlgTitle"></h2><button class="btn small" data-close>Close</button></div><div class="db" id="dlgBody"></div><div class="df" id="dlgFoot"></div></dialog>
<div id="toast" hidden></div>
<datalist id="langs"><option value="de"><option value="en"><option value="it"><option value="fr"><option value="la"><option value="de-x-hist"><option value="el"></datalist>

<script src="https://cdn.jsdelivr.net/npm/n3@1.17.2/browser/n3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
'use strict';
/* ================= Namensräume ================= */
const NS = {
  skos: 'http://www.w3.org/2004/02/skos/core#', rdf: 'http://www.w3.org/1999/02/22-rdf-syntax-ns#',
  rdfs: 'http://www.w3.org/2000/01/rdf-schema#', dct: 'http://purl.org/dc/terms/', dc: 'http://purl.org/dc/elements/1.1/',
  owl: 'http://www.w3.org/2002/07/owl#', xsd: 'http://www.w3.org/2001/XMLSchema#', xl: 'http://www.w3.org/2008/05/skos-xl#',
  gvp: 'http://vocab.getty.edu/ontology#'
};
const SK = n => NS.skos + n;
const MATCH = ['exactMatch', 'closeMatch', 'broadMatch', 'narrowMatch', 'relatedMatch'];
const AAT_NS = 'http://vocab.getty.edu/aat/';
const LANG_ORDER = ['en', 'de', 'it', 'fr', 'la'];

/* ================= Zustand ================= */
let P;                 // Projekt
const C = new Map();   // URI -> Begriff
const SRC = new Map(); // Quellen der Bibliothek
let SEL = null;        // ausgewählter Begriff
let IDX = null;        // Unterbegriffs-Index
const OPEN = new Set();     // aufgeklappte Pfade im Baum
const OPENLIB = new Set();  // aufgeklappte Pfade in der Bibliothek
const UNDO = [];
function freshProject() {
  return { name: 'New thesaurus', scheme: 'http://example.org/thesaurus', schemeLabel: { en: 'New thesaurus' },
    prefixes: [{ p: 'aat', ns: AAT_NS, digits: 9, own: false }, { p: 'bbt', ns: 'https://vocabs.dariah.eu/bbt/Concept/', digits: 6, own: false }],
    defaultPrefix: '', passthrough: [], uiLang: 'en', dispLang: '', loaded: [] };
}
function newConcept(uri) {
  return { uri, notation: '', pref: {}, alt: [], def: [], scope: [], note: [], broader: [], related: [],
    match: { exactMatch: [], closeMatch: [], broadMatch: [], narrowMatch: [], relatedMatch: [] },
    schemes: new Set(), src: new Set(), extra: [] };
}
function getC(uri, create) { let c = C.get(uri); if (!c && create) { c = newConcept(uri); C.set(uri, c); } return c; }
const inW = c => c && c.schemes.has(P.scheme);

/* ================= Hilfen ================= */
const $ = s => document.querySelector(s);
function h(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k.nodeType ? k : document.createTextNode(k));
  return e;

/* ================= N-Quads-Ausgabe ================= */
function ownTriples() {

  for (const r of IDX.roots) add(P.scheme, SK('hasTopConcept'), U(r));
  for (const c of [...C.values()].filter(inW)) {
    const u = c.uri;
    add(u, NS.rdf + 'type', U(SK('Concept')));
    for (const sc of c.schemes) if (sc === P.scheme || !extKind(u)) add(u, SK('inScheme'), U(sc));
    if (c.notation) add(u, SK('notation'), Lt(c.notation));
    for (const [l, v] of Object.entries(c.pref)) add(u, SK('prefLabel'), Lt(v, l));
    for (const [k, p] of [['alt', 'altLabel'], ['def', 'definition'], ['scope', 'scopeNote'], ['note', 'note']]) for (const [v, l] of c[k]) add(u, SK(p), Lt(v, l));

    for (const k of (IDX.kids.get(u) || [])) if (inW(C.get(k))) add(u, SK('narrower'), U(k));
    if (!wParents(c).length) add(u, SK('topConceptOf'), U(P.scheme));
    for (const r of c.related) add(u, SK('related'), U(r));
    for (const m of MATCH) for (const x of c.match[m]) add(u, SK(m), U(x));

}
function ntTerm(o) {

  return '"' + o.v.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, '\\n').replace(/\r/g, '\\r') + '"' + (o.l ? '@' + o.l : o.d ? '^^<' + o.d + '>' : '');
}
const tKey = t => t.s.v + '\u0001' + t.p + '\u0001' + t.o.t + '\u0001' + t.o.v + '\u0001' + (t.o.l || '') + '\u0001' + (t.o.d || '');

  for (const c of C.values()) if (inW(c)) { used.add(c.uri); c.broader.forEach(b => used.add(b)); c.related.forEach(b => used.add(b)); for (const m of MATCH) c.match[m].forEach(b => used.add(b)); }

    if (!s.raw || !s.raw.length || !s.graph) continue;
    let n = 0; const seen = new Set();
    for (const t of s.raw) {
      if (!used.has(t.s.v) && !s.schemes.includes(t.s.v)) continue;
      const k = tKey(t); orig.add(k); if (seen.has(k)) continue; seen.add(k);
      lines.push(ntTerm(t.s) + ' <' + t.p + '> ' + ntTerm(t.o) + ' <' + s.graph + '> .'); n++;
    }
    stats.push(s.name + ': ' + n);

  let n = 0; const seen = new Set();

      if (asWorking && i === 0) { const keep = C.size && false; const r = loadAsWorking(tr, f.name, keep); toast(`${f.name}: ${r.conceptUris.length} concepts opened`); }

    } catch (err) { toast('Error reading ' + f.name + ': ' + err.message, 6000); }
  }
  SEL = null; refreshViews();
}

  const anc = h('input', { type: 'checkbox', id: 'aAnc', checked: true }); const langs = h('input', { id: 'aLangs', value: 'de,en,it' });
  const gettyFirst = h('input', { type: 'checkbox', id: 'aFirst', checked: true });
  const into = h('input', { type: 'checkbox', id: 'aInto', checked: false });
  const files = h('input', { type: 'file', id: 'aFiles', multiple: true, accept: '.nt' });
  const prog = h('div', { class: 'progress' }, h('div')); const log = h('div', { class: 'log', text: 'Bereit.' });
  const run = h('button', { class: 'btn primary', text: 'Extract concepts' });
  run.onclick = async () => {

      const r = ingest(tr, { id: 'lib:Getty AAT', name: 'Getty AAT (from dump)', kind: 'AAT', graph: AAT_NS }, { prefOverride: gettyFirst.checked });
      for (const u of r.conceptUris) { const c = C.get(u); if (!c.schemes.size) c.schemes.add(AAT_NS); }
      if (into.checked) for (const id of want) { const c = C.get(AAT_NS + id); if (c) c.schemes.add(P.scheme); }
      const missing = want.filter(id => !C.get(AAT_NS + id) || !Object.keys(C.get(AAT_NS + id).pref).length);
      log.textContent += `\nDone: ${r.conceptUris.length} AAT concepts taken over.` + (missing.length ? '\nNot in dump: ' + missing.join(', ') : '');
      OPENLIB.add('src:lib:Getty AAT'); refreshViews();

  };
  openDialog('Take over AAT concepts from the Getty dump', [
    h('p', { text: 'Select the unpacked N-Triples files of the Getty dump (explicit.zip). The files are read only in this browser, nothing is uploaded. Required are AATOut_1Subjects.nt, AATOut_2Terms.nt, AATOut_ScopeNotes.nt and AATOut_HierarchicalRels.nt; further files do no harm but take longer.' }),
    h('label', { class: 'grid2' }, h('span', { class: 'muted', text: 'AAT numbers (prefilled: those used in the working thesaurus)' })), ids,
    h('div', { class: 'grid2' }, h('label', null, 'Languages for labels and scope notes', langs), h('label', null, 'Dump files (.nt)', files)),
    h('label', { class: 'check' }, anc, 'Include Getty broader concepts up to the facet'),
    h('label', { class: 'check' }, gettyFirst, 'Getty labels take precedence (own differing labels become alternative labels)'),
    h('label', { class: 'check' }, into, 'Also add the given concepts to the working thesaurus'),
    prog, log], [run]);
}
async function* lines(file, onBytes) {
  const reader = file.stream().pipeThrough(new TextDecoderStream()).getReader(); let buf = '', read = 0;
  while (true) { const { value, done } = await reader.read(); if (done) break; read += value.length; buf += value; let i;
    let start = 0; while ((i = buf.indexOf('\n', start)) >= 0) { yield buf.slice(start, i); start = i + 1; } buf = buf.slice(start); onBytes && onBytes(read); }
  if (buf) yield buf;
}
const NTRE = /^(<[^>]*>|_:\S+)\s+<([^>]*)>\s+(.*?)\s*\.\s*$/;
async function aatFromDump(files, ids, o, report) {
  const total = files.reduce((a, f) => a + f.size, 0) * (o.ancestors ? 3 : 2); let doneBytes = 0;
  const pass = async (label, fn) => { report(label); for (const f of files) { const base = doneBytes; report('  ' + f.name); for await (const ln of lines(f, b => report && (doneBytes = base + b * 1, 0))) fn(ln); doneBytes = base + f.size; report(null, doneBytes / total); } };
  const want = new Set(ids.map(i => '<' + AAT_NS + i + '>'));
  if (o.ancestors) {
    const par = new Map(); const BP = 'http://vocab.getty.edu/ontology#broaderPreferred';
    await pass('Pass 1: Getty hierarchy …', ln => { if (ln.includes('broaderPreferred')) { const m = ln.match(NTRE); if (m && m[2] === BP) par.set(m[1], m[3].trim()); } });
    const todo = [...want]; while (todo.length) { const p = par.get(todo.pop()); if (p && !want.has(p)) { want.add(p); todo.push(p); } }
    report(`  with broader concepts: ${want.size} concepts`);
  }
  const keep = []; const nodes = new Set();
  const NODEP = new Set([SK('scopeNote'), NS.xl + 'prefLabel', NS.xl + 'altLabel', NS.gvp + 'prefLabelGVP']);
  await pass('Pass 2: concepts …', ln => { if (!ln.startsWith('<http://vocab.getty.edu/aat/')) return; const sEnd = ln.indexOf('>') + 1; if (!want.has(ln.slice(0, sEnd))) return; const m = ln.match(NTRE); if (!m) return; keep.push(ln); if (NODEP.has(m[2]) && m[3].startsWith('<')) nodes.add(m[3].trim()); });
  if (nodes.size) {
    const VP = new Set([NS.rdf + 'value', NS.xl + 'literalForm', NS.dct + 'language']);
    await pass(`Pass 3: ${nodes.size} scope notes and terms …`, ln => { if (ln[0] !== '<') return; const sEnd = ln.indexOf('>') + 1; if (!nodes.has(ln.slice(0, sEnd))) return; const m = ln.match(NTRE); if (m && VP.has(m[2])) keep.push(ln); });
  }
  report(null, 1);
  const raw = new N3.Parser({ format: 'N-Triples' }).parse(keep.join('\n')).map(q => ({ s: termFromN3(q.subject), p: q.predicate.value, o: termFromN3(q.object) }));
  return rawGettyToSkos(raw, [...want].map(w => w.slice(1, -1)), o.langs);
}
function rawGettyToSkos(raw, uris, langs) {
  const by = new Map(); for (const t of raw) { if (!by.has(t.s.v)) by.set(t.s.v, []); by.get(t.s.v).push(t); }
  const objs = (s, p) => (by.get(s) || []).filter(t => t.p === p).map(t => t.o);
  const okL = l => !langs.length || !l || langs.includes(l.split('-')[0]);
  const out = []; const add = (s, p, o) => out.push({ s: { t: 'u', v: s }, p, o });
  for (const u of uris) {
    if (!by.has(u)) continue;
    add(u, NS.rdf + 'type', { t: 'u', v: SK('Concept') }); add(u, SK('inScheme'), { t: 'u', v: AAT_NS });
    let pl = objs(u, SK('prefLabel')); if (!pl.length) pl = objs(u, NS.xl + 'prefLabel').flatMap(t => objs(t.v, NS.xl + 'literalForm'));
    let al = objs(u, SK('altLabel')); if (!al.length) al = objs(u, NS.xl + 'altLabel').flatMap(t => objs(t.v, NS.xl + 'literalForm'));
    const seen = new Set();
    for (const l of pl) if (l.t === 'l' && okL(l.l)) { if (seen.has(l.l)) add(u, SK('altLabel'), l); else { seen.add(l.l); add(u, SK('prefLabel'), l); } }
    for (const l of al) if (l.t === 'l' && okL(l.l)) add(u, SK('altLabel'), l);
    for (const sn of objs(u, SK('scopeNote'))) { const vs = sn.t === 'l' ? [sn] : objs(sn.v, NS.rdf + 'value'); for (const v of vs) if (okL(v.l)) add(u, SK('scopeNote'), v); }
    for (const b of objs(u, NS.gvp + 'broaderPreferred')) if (b.v !== u) add(u, SK('broader'), b);
    for (const id of objs(u, NS.dc + 'identifier')) add(u, SK('notation'), id);
    for (const ps of objs(u, NS.gvp + 'parentString')) add(u, NS.gvp + 'parentString', ps);
    for (const m of ['exactMatch', 'closeMatch']) for (const x of objs(u, SK(m))) add(u, SK(m), x);
    add(u, NS.dct + 'source', { t: 'u', v: 'http://vocab.getty.edu/page/aat/' + u.slice(AAT_NS.length) });
  }
  return out;
}

/* ---------- Prüfen ---------- */
function validateDialog() {
  buildIndex(); const issues = [];
  const w = [...C.values()].filter(inW);
  for (const c of w) {
    if (!Object.values(c.pref).some(v => v)) issues.push(['Error', c.uri, 'no preferred label']);
    for (const [v, l] of c.alt) if (Object.entries(c.pref).some(([pl, pv]) => pl === l && pv.toLowerCase() === v.toLowerCase())) issues.push(['Error', c.uri, `alternative label "${v}" equals the preferred one`]);
    if (c.broader.includes(c.uri) || isAncestor(c.uri, c.uri)) issues.push(['Error', c.uri, 'cycle in the hierarchy']);
    if (!wParents(c).length && !(IDX.wkids.get(c.uri) || []).length) issues.push(['Note', c.uri, 'neither broader nor narrower concept']);
    const ps = wParents(c); for (const p of ps) if (ps.some(q => q !== p && isAncestor(p, q))) issues.push(['Note', c.uri, `broader concept "${labU(p)}" is already an ancestor of another broader concept (redundant)`]);
    for (const b of c.broader) if (!C.has(b)) issues.push(['Note', c.uri, 'broader concept without data: ' + b]);
  }
  const byL = new Map(); for (const c of w) { const l = lab(c).toLowerCase(); if (!byL.has(l)) byL.set(l, []); byL.get(l).push(c.uri); }
  for (const [l, us] of byL) if (us.length > 1) issues.push(['Note', us[0], `same label for ${us.length} concepts: ${us.map(u => cid(C.get(u))).join(', ')}`]);
  const list = h('div');
  const errs = issues.filter(i => i[0] === 'Error').length;
  for (const [k, u, msg] of issues.slice(0, 500)) list.append(h('div', { class: 'issue' }, h('span', { class: 'k' + (k === 'Note' ? ' w' : ''), text: k }),
    h('div', null, h('a', { text: labU(u) + ' (' + cid(C.get(u) || { uri: u, notation: '' }) + ')', onclick: () => { closeDialog(); select(u, true); } }), ' – ', msg)));
  openDialog('Validation', [h('p', { text: `${w.length} concepts checked: ${errs} errors, ${issues.length - errs} notes.` + (issues.length > 500 ? ' Shown: the first 500.' : '') }), list], []);
}

/* ---------- Export ---------- */
function exportRows() {
  buildIndex();
  const langs = new Set(); for (const c of C.values()) if (inW(c)) for (const l of Object.keys(c.pref)) langs.add(l);
  const L = [...langs].sort(langSort);
  const head = ['id', 'uri', ...L.map(l => 'prefLabel_' + (l || 'none')), 'altLabels', 'definition', 'scopeNote', 'broader_ids', 'broader_labels', 'exactMatch', 'closeMatch', 'origin'];
  const rows = [head];
  for (const c of [...C.values()].filter(inW).sort((a, b) => cid(a).localeCompare(cid(b), 'de', { numeric: true })))
    rows.push([cid(c), c.uri, ...L.map(l => c.pref[l] || ''), c.alt.map(([v, l]) => (l ? l + ': ' : '') + v).join(' | '),
      c.def.map(([v, l]) => (l ? l + ': ' : '') + v).join(' | '), c.scope.map(([v, l]) => (l ? l + ': ' : '') + v).join(' | '),
      wParents(c).map(b => cid(C.get(b))).join(' | '), wParents(c).map(labU).join(' | '), c.match.exactMatch.join(' | '), c.match.closeMatch.join(' | '), extKind(c.uri) || 'own']);
  return rows;
}
async function doAct(a) {

    case 'openLibrary': return openSkos(false);

    case 'openMindmap': return mindmapDialog();
    case 'openAat': return aatDialog();
    case 'prefixes': return prefixDialog();
    case 'validate': return validateDialog();
    case 'newTop': return newConceptDialog(SEL && inW(C.get(SEL)) ? SEL : null);
    case 'collapseAll': OPEN.clear(); return renderTree();
    case 'newProject': {
      const nm = h('input', { value: 'Neuer Thesaurus' }); const sch = h('input', { value: 'http://example.org/thesaurus' }); const pre = h('input', { value: 'th' }); const ns = h('input', { value: 'http://example.org/concept/' });
      return openDialog('New, empty project', [h('p', { class: 'muted', text: 'The current working state will be discarded. Save it as a project file first if you still need it.' }),
        h('div', { class: 'grid2' }, h('label', null, 'Name', nm), h('label', null, 'URI of the scheme', sch), h('label', null, 'Own prefix', pre), h('label', null, 'Namespace for new concepts', ns))],
        [h('button', { class: 'btn primary', text: 'Create', onclick: () => { C.clear(); SRC.clear(); P = freshProject(); P.name = nm.value; P.scheme = sch.value; P.schemeLabel = { en: nm.value }; P.prefixes.push({ p: pre.value, ns: ns.value, digits: 6, own: true }); P.defaultPrefix = pre.value; UNDO.length = 0; SEL = null; OPEN.clear(); closeDialog(); refreshViews(); } })]);
    }
    case 'openProject': { const [f] = await pickFile('.json'); if (!f) return; try { const t = loadProjectJson(await f.text()); toast('Project opened (saved ' + new Date(t).toLocaleString('en-GB') + ')'); refreshViews(); } catch (e) { toast(e.message, 6000); } return; }
    case 'saveProject': return saveFile(fileBase() + '_projekt.json', projectJson());
    case 'exportTtl': { if (!(await getDL())) return saveFile(fileBase() + '.ttl', makeTtl()); const z = new JSZip(); z.file(fileBase() + '.ttl', makeTtl()); return saveFile(fileBase() + '_skos.zip', await z.generateAsync({ type: 'blob', compression: 'DEFLATE' })); }
    case 'exportNq': {
      const { text, stats } = makeNq(); toast('Graphen – ' + stats.join(' · ') + ' Tripel', 6000);
      if (!(await getDL())) return saveFile(fileBase() + '.nq', text);
      const z = new JSZip(); z.file(fileBase() + '.nq', text); return saveFile(fileBase() + '_nquads.zip', await z.generateAsync({ type: 'blob', compression: 'DEFLATE' }));
    }
    case 'copyTtl': { const t = makeTtl(); try { await navigator.clipboard.writeText(t); toast('Turtle copied (' + Math.round(t.length / 1024) + ' KB)'); } catch (e) { const ta = h('textarea', { rows: 16, style: 'width:100%' }); ta.value = t; openDialog('Turtle', [h('p', { class: 'muted', text: 'Copying was not allowed – select the text and copy it with Ctrl+C.' }), ta], []); ta.select(); } return; }
    case 'exportXlsx': { const ws = XLSX.utils.aoa_to_sheet(exportRows()); const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'begriffe'); const out = XLSX.write(wb, { type: 'array', bookType: 'xlsx' }); return saveFile(fileBase() + '_begriffe.xlsx', new Blob([out])); }
    case 'exportMindmap': case 'exportMm': {
      const root = mindmapTree(); let name, data;
      if (a === 'exportMindmap') { const mm = new JSZip(); mm.file('Document.xml', makeMmap(root)); name = fileBase() + '.mmap'; data = await mm.generateAsync({ type: 'blob', compression: 'DEFLATE' }); }
      else { name = fileBase() + '.mm'; data = makeMm(root); }
      if (await getDL()) { const z = new JSZip(); z.file(name, data); return saveFile(name.replace('.', '_') + '.zip', await z.generateAsync({ type: 'blob', compression: 'DEFLATE' })); }  // im claude.ai-Viewer sind .mmap/.mm nicht erlaubt
      return saveFile(name, data);

}
document.addEventListener('click', e => {
  const m = e.target.closest('[data-menu]');
  if (m) { const pop = document.getElementById(m.dataset.menu); const was = pop.hidden; for (const p of document.querySelectorAll('.menu > .pop')) p.hidden = true; pop.hidden = !was; e.stopPropagation(); return; }
